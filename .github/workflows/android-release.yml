name: Release Android App

on:
  push:
    tags:
      - 'v*'
      - '[0-9]+.[0-9]+.[0-9]+*'

jobs:
  build-and-release:
    name: Build & Release Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        working-directory: flutter_todo
        run: flutter pub get

      - name: Analyze code
        working-directory: flutter_todo
        run: flutter analyze

      - name: Run tests
        working-directory: flutter_todo
        run: flutter test

      - name: Extract Tag Name
        id: tag_name
        run: echo "TAG=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Build Android Release APK
        working-directory: flutter_todo
        run: |
          # Strip leading 'v' for build name if present
          VERSION="${TAG#v}"
          flutter build apk --release --build-name="$VERSION"
        env:
          TAG: ${{ steps.tag_name.outputs.TAG }}

      - name: Create GitHub Release and Upload APK
        uses: softprops/action-gh-release@v2
        with:
          files: flutter_todo/build/app/outputs/flutter-apk/app-release.apk
          name: Release ${{ steps.tag_name.outputs.TAG }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
